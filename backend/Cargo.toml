[package]
name = "pesatext_backend"
version = "0.1.0"
edition = "2021"
authors = ["Jones", "Amir"]

[dependencies]
actix-web = "4.4.0"
actix-cors = "0.6.4"
tokio = { version = "1.32.0", features = ["full"] }
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"
sqlx = { version = "0.7.1", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
dotenvy = "0.15.7"
chrono = { version = "0.4.31", features = ["serde"] }
reqwest = { version = "0.11.22", features = ["json", "rustls-tls"] }
log = "0.4.20"
env_logger = "0.10.0"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing-actix-web = "0.7.9"
lazy_static = "1.4.0"
