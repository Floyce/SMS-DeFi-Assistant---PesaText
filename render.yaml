services:
  - type: web
    name: pesatext-backend
    runtime: rust
    repo: https://github.com/Floyce/SMS-DeFi-Assistant---PesaText
    plan: free
    rootDir: backend
    buildCommand: cargo build --release
    startCommand: ./target/release/pesatext_backend
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        value: sqlite://pesatext.db
      - key: AFRICAS_TALKING_API_KEY
        sync: false
      - key: AFRICAS_TALKING_USERNAME
        value: sandbox
      - key: AFRICAS_TALKING_SHORTCODE
        value: 83078
      - key: SOROBAN_CONTRACT_ID
        value: CDIMDNUZHI2M3WHYB4CF2ND6O2OLPUKRTNYJ5QHX7AER7TBBHLGDGIV5
      - key: STELLAR_RPC_URL
        value: https://soroban-testnet.stellar.org